<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="AttendTrack — Attendance management for educational institutes. Admin and Trainer portals.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AttendTrack</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-tokens.css?v=9">
  <link rel="stylesheet" href="css/themes.css?v=9">
  <link rel="stylesheet" href="css/animations.css?v=9">
  <link rel="stylesheet" href="css/components.css?v=9">
  <style>
    /* Login */
    .login-page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      background: var(--gray-50);
    }
    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--md-surface);
      border: var(--border);
      border-radius: var(--radius-xl);
      padding: 32px 28px;
      box-shadow: var(--shadow-md);
    }
    .login-header {
      text-align: center;
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: var(--border);
    }
    .login-logo {
      width: 52px; height: 52px;
      background: var(--primary);
      border-radius: var(--radius-lg);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      margin: 0 auto 14px;
    }
    .role-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      background: var(--md-surface);
      width: 100%;
      text-align: left;
    }
    .role-card:hover  { border-color: var(--primary); background: var(--primary-light); }
    .role-card:active { background: #dbeafe; }
    .role-icon {
      width: 42px; height: 42px;
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .role-icon.admin   { background: #fef3c7; }
    .role-icon.trainer { background: #ede9fe; }
  </style>
</head>
<body>
  <div id="app">
    <div id="page-container"></div>
    <div class="toast-container" id="toast-container"></div>
  </div>

  <!-- Core -->
  <script src="js/api.js?v=10"></script>
  <script src="js/data-mock.js?v=10"></script>
  <script src="js/auth.js?v=10"></script>
  <script src="js/router.js?v=10"></script>
  <script src="js/store.js?v=10"></script>
  <script src="js/utils.js?v=10"></script>
  <!-- Trainer -->
  <script src="js/trainer/swipe-engine.js?v=10"></script>
  <script src="js/trainer/dashboard.js?v=10"></script>
  <script src="js/trainer/attendance.js?v=10"></script>
  <script src="js/trainer/summary.js?v=10"></script>
  <!-- Admin -->
  <script src="js/admin/dashboard.js?v=10"></script>
  <script src="js/admin/batches.js?v=10"></script>
  <script src="js/admin/students.js?v=10"></script>
  <script src="js/admin/reports.js?v=10"></script>
  <script src="js/admin/analytics.js?v=10"></script>

  <script>
  /* ── LOGIN ─────────────────────────────────────────────────── */
  function renderLogin(container) {
    container.innerHTML = `
      <div class="login-page">
        <div class="login-card">

          <div class="login-header">
            <div class="login-logo">📋</div>
            <h1 style="font-size:20px;font-weight:700;color:var(--gray-900);margin-bottom:4px">AttendTrack</h1>
            <p style="font-size:13px;color:var(--gray-500)">Attendance Management System</p>
          </div>

          <p style="font-size:12px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px">Select your role</p>

          <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px">
            <button class="role-card" data-email="admin@demo.com" data-pwd="admin123">
              <div class="role-icon admin">👑</div>
              <div>
                <div style="font-size:14px;font-weight:600;color:var(--gray-900)">Administrator</div>
                <div style="font-size:12px;color:var(--gray-500);margin-top:1px">Manage batches, students &amp; reports</div>
              </div>
              <svg style="margin-left:auto;flex-shrink:0;color:var(--gray-400)" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
            </button>

            <button class="role-card" data-email="trainer@demo.com" data-pwd="trainer123">
              <div class="role-icon trainer">🎓</div>
              <div>
                <div style="font-size:14px;font-weight:600;color:var(--gray-900)">Trainer</div>
                <div style="font-size:12px;color:var(--gray-500);margin-top:1px">Mark attendance for your batches</div>
              </div>
              <svg style="margin-left:auto;flex-shrink:0;color:var(--gray-400)" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>

          <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
            <div class="divider" style="flex:1"></div>
            <span style="font-size:12px;color:var(--gray-400)">or sign in manually</span>
            <div class="divider" style="flex:1"></div>
          </div>

          <div style="display:flex;flex-direction:column;gap:10px">
            <div class="input-wrapper">
              <label class="input-label" for="login-email">Email address</label>
              <input id="login-email" class="input-field" type="email" placeholder="you@example.com" autocomplete="email" inputmode="email">
            </div>
            <div class="input-wrapper">
              <label class="input-label" for="login-pwd">Password</label>
              <input id="login-pwd" class="input-field" type="password" placeholder="••••••••" autocomplete="current-password">
            </div>
            <div id="login-err" style="display:none;font-size:13px;color:var(--md-error);background:var(--md-error-cont);padding:8px 12px;border-radius:var(--radius-md)"></div>
            <button class="btn btn-filled btn-block btn-lg" id="sign-in-btn" style="margin-top:4px">Sign In</button>
          </div>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:16px;border-top:var(--border)">
            <span style="font-size:11px;color:var(--gray-400)">Demo — no external data storage</span>
            <button id="theme-btn" class="icon-btn" style="font-size:14px" title="Toggle theme">☀︎</button>
          </div>
        </div>
      </div>
    `;

    // Role card click
    container.querySelectorAll('.role-card').forEach(card => {
      card.addEventListener('click', () => _doLogin(container, card.dataset.email, card.dataset.pwd, card));
    });

    // Manual sign-in
    container.querySelector('#sign-in-btn').addEventListener('click', () => {
      const email = container.querySelector('#login-email').value.trim();
      const pwd   = container.querySelector('#login-pwd').value;
      if (!email || !pwd) { _showErr(container, 'Please enter email and password.'); return; }
      _doLogin(container, email, pwd, container.querySelector('#sign-in-btn'));
    });
    container.querySelector('#login-pwd').addEventListener('keydown', e => {
      if (e.key === 'Enter') container.querySelector('#sign-in-btn').click();
    });

    // Theme
    container.querySelector('#theme-btn').addEventListener('click', () => {
      const html = document.documentElement;
      html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
  }

  async function _doLogin(container, email, pwd, triggerEl) {
    if (triggerEl) { triggerEl.disabled = true; }
    try {
      const user = await Auth.login(email, pwd);
      const map  = { admin: 'admin-dashboard', trainer: 'trainer-dashboard' };
      Router.go(map[user.role] || 'login');
    } catch (err) {
      _showErr(container, err.message || 'Invalid credentials.');
    } finally {
      if (triggerEl) { triggerEl.disabled = false; }
    }
  }

  function _showErr(container, msg) {
    const el = container.querySelector('#login-err');
    if (!el) return;
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 4000);
  }

  /* ── ROUTE REGISTRATION ────────────────────────────────────── */
  Router.register('login',             renderLogin);
  Router.register('trainer-dashboard', renderTrainerDashboard);
  Router.register('swipe-attendance',  renderSwipeAttendance);
  Router.register('admin-dashboard',   renderAdminDashboard);
  Router.register('admin-batches',     renderAdminBatches);
  Router.register('admin-students',    renderAdminStudents);
  Router.register('admin-reports',     renderAdminReports);
  Router.register('admin-analytics',   renderAdminAnalytics);

  /* ── BOOT ──────────────────────────────────────────────────── */
  (async () => {
    // Open local IndexedDB and restore database cache
    if (window.Store && window.MockDB) {
      await window.Store.openDB().catch(() => {});
      await window.MockDB.loadFromIndexedDB().catch(() => {});
    }

    // Service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    const session = Auth.getSession();
    const map = { admin: 'admin-dashboard', trainer: 'trainer-dashboard', student: 'student-dashboard' };
    const hash = window.location.hash.replace('#', '').split('?')[0];

    if (session && (hash === 'login' || hash === '')) {
      window.location.hash = '#' + (map[session.role] || 'login');
      return;
    }
    if (!session && hash !== 'login' && hash !== '') {
      window.location.hash = '#login';
      return;
    }

    Router.init();

    // Trigger offline queue synchronization
    if (window.Store) {
      window.Store.syncPending().catch(() => {});
    }
  })();
  </script>
</body>
</html>
